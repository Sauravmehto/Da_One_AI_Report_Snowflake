# ── Morning Briefing ────────────────────────────────────────────────────

[briefing]
enabled = true
title = "Private Credit Fund Morning Briefing"
snapshot_table = "PRIVATECREDIT.PUBLIC.PORTFOLIO_SNAPSHOTS"

[briefing.metrics.portfolio_summary]
label = "Portfolio Summary"
sql = """
SELECT
  COUNT(*) AS total_deals,
  SUM(CASE WHEN LOAN_STATUS = 'Active' THEN 1 ELSE 0 END) AS active_deals,
  SUM(CASE WHEN LOAN_STATUS = 'Watch-list' THEN 1 ELSE 0 END) AS watchlist_deals,
  SUM(CASE WHEN COVENANT_STATUS IN ('Breach Risk', 'Monitoring') THEN 1 ELSE 0 END) AS covenant_risk_deals,
  ROUND(SUM(PRINCIPAL), 2) AS total_principal,
  ROUND(SUM(CURRENT_VALUE), 2) AS total_current_value,
  ROUND(SUM(CURRENT_VALUE) - SUM(PRINCIPAL), 2) AS total_unrealized_gl,
  ROUND(AVG(LTV_PCT), 2) AS avg_ltv,
  ROUND(AVG(DSCR), 2) AS avg_dscr
FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT
"""

[briefing.metrics.risk_breaches]
label = "Risk Limit Breaches"
sql = """
SELECT LIMIT_CATEGORY, LIMIT_TYPE, LIMIT_THRESHOLD_PCT, CURRENT_LEVEL_PCT_Q1_2026, STATUS
FROM PRIVATECREDIT.PUBLIC.PC_RISK_LIMITS
WHERE STATUS = 'Breach'
ORDER BY CURRENT_LEVEL_PCT_Q1_2026 DESC
"""

[briefing.metrics.late_payments]
label = "Late or Pending Payments"
sql = """
SELECT SECURITY_ID, BORROWER_NAME, PAYMENT_DATE, TOTAL_PAYMENT, ACTUAL_PAYMENT, PAYMENT_STATUS, DAYS_LATE
FROM PRIVATECREDIT.PUBLIC.PC_CASHFLOW
WHERE PAYMENT_STATUS NOT IN ('Paid') AND PAYMENT_DATE <= CURRENT_DATE()
ORDER BY PAYMENT_DATE DESC
"""

[briefing.metrics.deal_status_detail]
label = "Deal Status Detail"
type = "list"
id_field = "SECURITY_ID"
sql = """
SELECT SECURITY_ID, BORROWER_NAME, LOAN_STATUS, COVENANT_STATUS, ROUND(PRINCIPAL, 2) AS PRINCIPAL, ROUND(CURRENT_VALUE, 2) AS CURRENT_VALUE
FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT
ORDER BY PRINCIPAL DESC
"""

[briefing.metrics.latest_investor_performance]
label = "Latest Investor Performance"
sql = """
SELECT ip.INVESTOR_NAME, i.INVESTOR_TYPE, ip.NAV_THIS_QUARTER, ip.TVPI, ip.DPI, ip.GROSS_IRR_PCT
FROM PRIVATECREDIT.PUBLIC.PC_INVESTOR_POSITIONS ip
JOIN PRIVATECREDIT.PUBLIC.PC_INVESTORS i ON ip.INVESTOR_ID = i.INVESTOR_ID
WHERE ip.QUARTER_END_DATE = (SELECT MAX(QUARTER_END_DATE) FROM PRIVATECREDIT.PUBLIC.PC_INVESTOR_POSITIONS)
ORDER BY ip.NAV_THIS_QUARTER DESC
"""

[[briefing.kpi_cards]]
metric_key = "portfolio_summary"
field = "total_deals"
label = "Total Deals"
up_is = "neutral"

[[briefing.kpi_cards]]
metric_key = "portfolio_summary"
field = "watchlist_deals"
label = "Watch-list Deals"
up_is = "bad"

[[briefing.kpi_cards]]
metric_key = "portfolio_summary"
field = "covenant_risk_deals"
label = "Covenant Risk Deals"
up_is = "bad"

[[briefing.kpi_cards]]
metric_key = "portfolio_summary"
field = "total_principal"
label = "Total Principal"
