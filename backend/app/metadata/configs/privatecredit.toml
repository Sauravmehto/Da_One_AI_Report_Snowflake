# ── Business Metrics ────────────────────────────────────────────────────
# Named, authoritative definitions for common fund calculations. When a user
# asks about one of these, Claude uses the exact SQL below instead of inventing
# its own formula. All columns here are NUMBER type — no text parsing needed.
# (Note: this top-level [metrics] table is separate from [briefing.metrics.*],
#  which drives the morning briefing dashboard.)

[metrics."Total Unrealized Gain/Loss"]
definition = "Portfolio-wide unrealized gain or loss: current fair value minus original principal across all deals."
sql = "SELECT SUM(CURRENT_VALUE) - SUM(PRINCIPAL) AS total_unrealized_gl FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT"

[metrics."Portfolio Mark-to-Par"]
definition = "Current fair value as a percentage of original principal across the whole portfolio. 100% means valued at par."
sql = "SELECT 100.0 * SUM(CURRENT_VALUE) / NULLIF(SUM(PRINCIPAL), 0) AS mark_to_par_pct FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT"

[metrics."Weighted Average Interest Rate"]
definition = "Cash interest rate across the portfolio, weighted by principal. Excludes PIK."
sql = "SELECT SUM(INTEREST_RATE_PCT * PRINCIPAL) / NULLIF(SUM(PRINCIPAL), 0) AS wac_pct FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT"

[metrics."Average DSCR"]
definition = "Average debt service coverage ratio across all deals. Higher is safer."
sql = "SELECT AVG(DSCR) AS avg_dscr FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT"

[metrics."Watch-list Exposure"]
definition = "Total principal tied up in deals flagged Watch-list, and its share of the portfolio."
sql = "SELECT SUM(CASE WHEN LOAN_STATUS = 'Watch-list' THEN PRINCIPAL ELSE 0 END) AS watchlist_principal, 100.0 * SUM(CASE WHEN LOAN_STATUS = 'Watch-list' THEN PRINCIPAL ELSE 0 END) / NULLIF(SUM(PRINCIPAL), 0) AS watchlist_pct FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT"

[metrics."Covenant At-Risk Deal Count"]
definition = "Number of deals whose covenant status is not fully compliant (Breach Risk or Monitoring)."
sql = "SELECT COUNT_IF(COVENANT_STATUS IN ('Breach Risk', 'Monitoring')) AS at_risk_deals FROM PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT"

[metrics."Risk Limit Breach Count"]
definition = "Number of fund-level risk limits currently in breach."
sql = "SELECT COUNT_IF(STATUS = 'Breach') AS breached_limits FROM PRIVATECREDIT.PUBLIC.PC_RISK_LIMITS"

[metrics."Late Payment Count"]
definition = "Number of cashflow periods where the payment was received late (days late greater than zero)."
sql = "SELECT COUNT_IF(DAYS_LATE > 0) AS late_payments FROM PRIVATECREDIT.PUBLIC.PC_CASHFLOW"