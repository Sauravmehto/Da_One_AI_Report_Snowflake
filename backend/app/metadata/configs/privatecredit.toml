database = "PRIVATECREDIT"
display_name = "Private Credit Fund"
description = "Private credit fund data: deals, cashflows, quarterly marks, borrower financials, investor positions, fund expenses, risk limits, and FX rates."

# ── Join Rules ──────────────────────────────────────────────────────────
join_rules = """
- PRIVATE_CREDIT is the central deal/loan table. Most other tables join to it via SECURITY_ID.
- PC_CASHFLOW joins PRIVATE_CREDIT on SECURITY_ID (payment schedule per deal).
- PC_MARKS joins PRIVATE_CREDIT on SECURITY_ID (quarterly valuations per deal).
- PC_BORROWER_FINANCIALS joins PRIVATE_CREDIT on SECURITY_ID (annual borrower financials).
- PC_INVESTORS is the LP investor master. PC_INVESTOR_POSITIONS joins PC_INVESTORS on INVESTOR_ID (quarterly investor-level positions).
- PC_FUND_MASTER has exactly 1 row — the fund itself. Join to PC_FUND_EXPENSES on FUND_ID, join to PC_RISK_LIMITS on FUND_ID.
- PC_FX_RATES is a standalone FX rate lookup. Join on QUARTER_LABEL or RATE_DATE when converting currencies.
- PRIVATE_CREDIT and PC_INVESTORS do NOT join directly. To connect deals to investors, summarize at fund level.
- Always use LEFT JOIN when the right side may not have matching rows.
- Never use implicit joins or cartesian products.
"""

# ── Dashboard Planner Heuristics ────────────────────────────────────────
dashboard_heuristics = """
- If the user asks about portfolio overview, include panels for: deal count by sector, principal by geography, covenant status breakdown, and loan status mix.
- If the user asks about risk or concentration, query PC_RISK_LIMITS and show limit vs current level, highlighting breaches (STATUS = 'Breach') in red.
- If the user asks about investor positions or LP performance, query PC_INVESTOR_POSITIONS for the latest quarter. Show TVPI, DPI, RVPI, gross IRR per investor. Join to PC_INVESTORS for investor type.
- If the user asks about cashflows or payments, query PC_CASHFLOW. Show payment status breakdown, days late distribution, scheduled vs actual payments.
- If the user asks about marks or valuations, query PC_MARKS for the latest quarter. Show fair value vs outstanding principal, unrealized gain/loss, mark-to-par.
- If the user asks about borrower health, query PC_BORROWER_FINANCIALS. Show leverage ratio, interest coverage, EBITDA margin across borrowers.
- If the user asks about fund expenses, query PC_FUND_EXPENSES. Show expense trend by quarter, expense breakdown by category.
- For "watch-list" or "problem loans", filter PRIVATE_CREDIT where LOAN_STATUS = 'Watch-list' OR COVENANT_STATUS IN ('Breach Risk', 'Monitoring').
- QUARTER_LABEL is a TEXT field with values like 'Q1 2025'. For time-series ordering, use QUARTER_END_DATE (DATE) when available, or sort QUARTER_LABEL alphabetically which works for this format.
- All numeric columns in this database are actual NUMBER type — no text parsing needed unlike the LOAN database.
"""

# ── Semantic Layer: Tables ──────────────────────────────────────────────

[tables."PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT"]
description = "Core deal/loan table. Each row is one private credit investment (5 deals total)."
notes = "Central fact table. Join other tables to this via SECURITY_ID. LOAN_STATUS values: Active, Extended, Matured-Pending, Watch-list. COVENANT_STATUS values: Compliant, Monitoring, Breach Risk."
[tables."PRIVATECREDIT.PUBLIC.PRIVATE_CREDIT".key_columns]
SECURITY_ID = "Unique deal identifier (TEXT). Primary key. Used to join PC_CASHFLOW, PC_MARKS, PC_BORROWER_FINANCIALS."
SECURITY_NAME = "Human-readable deal name (TEXT)"
BORROWER_NAME = "Borrower company name (TEXT)"
SECTOR = "Industry sector. Values: Energy, Healthcare, Industrials, Retail, Technology"
GEOGRAPHY = "Country. Values: Canada, Germany, UK, USA"
PRINCIPAL = "Original principal amount (NUMBER)"
CURRENT_VALUE = "Current fair value of the position (NUMBER)"
INTEREST_RATE_PCT = "Cash interest rate as percentage (NUMBER, not text)"
PIK_RATE_PCT = "Payment-in-kind interest rate (NUMBER)"
LTV_PCT = "Loan-to-value percentage (NUMBER)"
DSCR = "Debt service coverage ratio (NUMBER). Higher is safer."
LOAN_STATUS = "Current status. Values: Active, Extended, Matured-Pending, Watch-list. Filter problem loans with: LOAN_STATUS IN ('Watch-list', 'Matured-Pending')"
COVENANT_STATUS = "Covenant compliance. Values: Compliant, Monitoring, Breach Risk. Filter at-risk with: COVENANT_STATUS IN ('Breach Risk', 'Monitoring')"
PAYMENT_TYPE = "Values: Amortizing, Bullet"
REPAYMENT_FREQUENCY = "Values: Monthly, Quarterly, Semi-Annual"
COLLATERAL_TYPE = "Values: IP & Software, Plant & Machinery, Real Assets, Receivables, Receivables & Inventory"
MATURITY_DATE = "Loan maturity date (DATE)"
ORIGINATION_DATE = "Loan origination date (DATE)"
BORROWER_LEVERAGE_RATIO = "Borrower's debt/EBITDA ratio (NUMBER). Higher = more leveraged."
INTEREST_COVERAGE_RATIO = "Borrower's EBITDA/interest ratio (NUMBER). Higher = more cushion."
TOTAL_INTEREST_RECEIVED = "Cumulative interest received to date (NUMBER)"
TOTAL_PRINCIPAL_REPAID = "Cumulative principal repaid to date (NUMBER)"

[tables."PRIVATECREDIT.PUBLIC.PC_CASHFLOW"]
description = "Period-by-period cashflow schedule for each deal. 110 rows covering all payment periods."
notes = "Joins to PRIVATE_CREDIT on SECURITY_ID. PAYMENT_STATUS values: Paid, Scheduled, Extended, Pending-Extension. Use DAYS_LATE > 0 to find late payments."
[tables."PRIVATECREDIT.PUBLIC.PC_CASHFLOW".key_columns]
SECURITY_ID = "Deal identifier (TEXT). FK to PRIVATE_CREDIT."
BORROWER_NAME = "Borrower company name (TEXT)"
PAYMENT_DATE = "Scheduled payment date (DATE)"
PERIOD_TYPE = "Type of payment period (TEXT)"
OPENING_BALANCE = "Principal balance at start of period (NUMBER)"
SCHEDULED_INTEREST = "Interest due for this period (NUMBER)"
PIK_INTEREST = "Payment-in-kind interest accrued (NUMBER)"
SCHEDULED_PRINCIPAL = "Principal due for this period (NUMBER)"
TOTAL_PAYMENT = "Total scheduled payment: interest + principal (NUMBER)"
ACTUAL_PAYMENT = "Amount actually received (NUMBER). Compare to TOTAL_PAYMENT."
CLOSING_BALANCE = "Principal balance at end of period (NUMBER)"
PAYMENT_STATUS = "Values: Paid, Scheduled, Extended, Pending-Extension"
DAYS_LATE = "Number of days the payment was late (NUMBER). 0 = on time."

[tables."PRIVATECREDIT.PUBLIC.PC_MARKS"]
description = "Quarterly mark-to-market valuations per deal. 59 rows."
notes = "Joins to PRIVATE_CREDIT on SECURITY_ID. Each row is one deal at one quarter-end. MARK_METHODOLOGY values: Cost, DCF."
[tables."PRIVATECREDIT.PUBLIC.PC_MARKS".key_columns]
SECURITY_ID = "Deal identifier (TEXT). FK to PRIVATE_CREDIT."
QUARTER_LABEL = "Quarter label e.g. 'Q1 2025' (TEXT)"
MARK_DATE = "Valuation date (DATE)"
OUTSTANDING_PRINCIPAL = "Principal outstanding at mark date (NUMBER)"
FAIR_VALUE = "Fair value of the position (NUMBER)"
UNREALIZED_GAIN_LOSS = "Unrealized gain/loss = Fair Value - Outstanding Principal (NUMBER). Positive = gain."
MARK_TO_PAR = "Fair value as percentage of par/principal (NUMBER). 1.0 = at par."
DSCR_AT_MARK = "DSCR at the time of this valuation (NUMBER)"
LTV_AT_MARK = "LTV at the time of this valuation (NUMBER)"
COVENANT_STATUS = "Covenant compliance at mark date. Values: Compliant, Monitoring, Breach Risk"
TOTAL_INCOME_ACCRUED = "Total income (cash + PIK) accrued at mark date (NUMBER)"
MARK_METHODOLOGY = "Valuation method. Values: Cost, DCF"

[tables."PRIVATECREDIT.PUBLIC.PC_BORROWER_FINANCIALS"]
description = "Annual borrower-level financial statements. 15 rows (5 borrowers × 3 years)."
notes = "Joins to PRIVATE_CREDIT on SECURITY_ID. One row per borrower per fiscal year."
[tables."PRIVATECREDIT.PUBLIC.PC_BORROWER_FINANCIALS".key_columns]
SECURITY_ID = "Deal identifier (TEXT). FK to PRIVATE_CREDIT."
