database = "RETAIL_DB"
display_name = "GCC Retail Store Performance Data"
description = "Weekly, store-level GCC retail performance data covering store operations, sales, inventory, customer, omnichannel, loss-prevention, labor, and budget/target performance. One row per store per week. Single flat table — no related child tables."
currency = "AED"
join_rules = """
- RETAIL_DB.PUBLIC.RETAIL is a single standalone table — there are no other tables in this database and no join keys to manage.
- Every metric for this domain lives in this one table; never attempt to join it to tables from a different database.
"""
dashboard_heuristics = """
- Query the table directly; one table, no joins.
- TRENDS: group and ORDER BY WEEK_START, or DATE_TRUNC('month', WEEK_START)
  for a monthly view. NEVER group or order by MONTH or QUARTER --
  they are TEXT labels ('Feb-2025'), so they sort ALPHABETICALLY and a trend
  chart comes out Apr, Aug, Dec, Feb. Use them only as a display label
  beside the real WEEK_START date.
- BREAKDOWNS: group by the categorical attribute columns.
- NEVER average a rate. Every *_PCT column is already computed for its own
  row, so AVG() across rows is an unweighted mean of ratios and is simply
  wrong -- it looks plausible and nothing on screen reveals it. Recompute
  from the underlying counts or amounts instead:
    100.0 * SUM(TRANSACTIONS) / NULLIF(SUM(STORE_ENTRIES), 0)
    NOT AVG(STORE_CONVERSION_PCT)
  The same applies to any ratio, average or per-unit column, not just _PCT.
- Report ACTUALS by default. Budget, forecast, target and benchmark columns (whether prefixed BUDGET_/FORECAST_/TARGET_/BENCHMARK_ or suffixed _BUDGET_AED/_FORECAST_AED) belong in variance panels only -- use them when the request is explicitly about budget, forecast, target or benchmark.
- Use the primary column, never its reconciliation twin. NET_SALES_AED is the sales figure; POS_NET_SALES_AED and ERP_NET_SALES_AED are the two systems being reconciled against it. Likewise STORE_CONVERSION_PCT over REPORTED_STORE_CONVERSION_PCT, and CLOSING_INVENTORY_UNITS_REPORTED over CALCULATED_CLOSING_INVENTORY_UNITS. Never sum a pair together.
- 53 of the *_AED columns are TEXT with comma separators. Cast with TRY_CAST(REPLACE(col, ',', '') AS FLOAT) before aggregating, comparing, OR SORTING -- an uncast ORDER BY sorts alphabetically, so '10,000.00' ranks above '9,933,927.27' and a top-N panel is silently wrong. Typing is NOT uniform by suffix: ATV_AED is text but ATV_VS_BUDGET_AED, SALES_PER_SQFT_AED, SALES_PER_TRADING_SQFT_AED, CONTRIBUTION_PER_SQFT_AED, TARGET_SALES_PER_SQFT_AED and BENCHMARK_SALES_PER_SQFT_AED are real NUMBER. Every *_PCT column here is clean NUMBER. Check each column's own (TEXT, comma-formatted) note rather than casting by name pattern.
- CATEGORY has duplicate spellings in the data, so one category would show as
  two bars, each half its real size:
  'Baby/Kids' is 'Baby & Kids', 'Fashion/Apparel' is 'Fashion & Apparel', 'Grocery/FMCG' is 'Grocery & FMCG', 'Health Wellness' is 'Health & Wellness'.
  Whenever you group, filter or label by CATEGORY, select this in place of the
  bare column:
    CASE CATEGORY WHEN 'Baby/Kids' THEN 'Baby & Kids' WHEN 'Fashion/Apparel' THEN 'Fashion & Apparel' WHEN 'Grocery/FMCG' THEN 'Grocery & FMCG' WHEN 'Health Wellness' THEN 'Health & Wellness' ELSE CATEGORY END AS CATEGORY
  GROUP BY its position (GROUP BY 1) or repeat the CASE expression -- NEVER
  GROUP BY CATEGORY, which Snowflake resolves to the raw column and brings the
  duplicates back. To filter, compare the same CASE expression.
"""

[tables."RETAIL_DB.PUBLIC.RETAIL"]
description = "Weekly store-level retail performance master. One row per store per week, ~800 rows total across 10 stores / 6 GCC countries, Feb 2025 - Aug 2026."
notes = "Single-table dataset — no join keys or child tables. 53 of the *_AED monetary columns are stored as TEXT with comma thousands-separators (e.g. \"2,777,810.54\") rather than NUMBER; strip commas with REPLACE(col, ',', '') and TRY_CAST to FLOAT before aggregating, comparing OR SORTING -- an uncast ORDER BY sorts alphabetically, so '10,000.00' outranks '9,933,927.27' and a top-N panel is silently wrong. Typing is not uniform by suffix: ATV_AED is text while ATV_VS_BUDGET_AED and the *_PER_SQFT_AED columns are real NUMBER, so check each column's own note rather than casting by name pattern. These columns are flagged with a (TEXT, comma-formatted) note below."

