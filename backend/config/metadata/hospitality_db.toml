database = "HOSPITALITY_DB"
display_name = "GCC Hospitality Property Performance Data"
description = "Monthly hotel/property performance data covering rooms revenue (ADR/RevPAR/occupancy), total revenue, profitability (GOP), cost structure, distribution channel mix, guest segment mix, booking behavior, sales/group business, F&B & events, guest experience/loyalty, property operations, and competitive benchmarking across GCC properties. One row per property per month. Single flat table — no related child tables."
currency = "AED"
join_rules = """
- HOSPITALITY_DB.PUBLIC.HOSPITALITY is a single standalone table — there are no other tables in this database and no join keys to manage.
- Every metric for this domain lives in this one table; never attempt to join it to tables from a different database.
"""
dashboard_heuristics = """
- Query the table directly; one table, no joins.
- TRENDS: group and ORDER BY PERIOD_START, or DATE_TRUNC('month', PERIOD_START)
  for a monthly view. NEVER group or order by MONTH or QUARTER or PERIOD_LABEL or PERIOD_RAW --
  they are TEXT labels ('Feb-2025'), so they sort ALPHABETICALLY and a trend
  chart comes out Apr, Aug, Dec, Feb. Use them only as a display label
  beside the real PERIOD_START date.
- BREAKDOWNS: group by the categorical attribute columns.
- NEVER average a rate. Every *_PCT column is already computed for its own
  row, so AVG() across rows is an unweighted mean of ratios and is simply
  wrong -- it looks plausible and nothing on screen reveals it. Recompute
  from the underlying counts or amounts instead:
    100.0 * SUM(ROOMS_SOLD) / NULLIF(SUM(AVAILABLE_ROOM_NIGHTS), 0)
    NOT AVG(OCCUPANCY_PCT)
  The same applies to any ratio, average or per-unit column, not just _PCT.
- Report ACTUALS by default. Budget, forecast, target and benchmark columns (whether prefixed BUDGET_/FORECAST_/TARGET_/BENCHMARK_ or suffixed _BUDGET_AED/_FORECAST_AED) belong in variance panels only -- use them when the request is explicitly about budget, forecast, target or benchmark.
- Use the reported column, never its calculated twin. ADR_REPORTED_AED and REVPAR_REPORTED_AED are the figures to show; ADR_CALCULATED_AED and REVPAR_CALCULATED_AED exist to reconcile against them. Never sum a pair together.
- 91 columns are TEXT carrying comma separators AND a literal trailing '%' on percentages ('9,933,927.27', '81.6%'). Cast with TRY_CAST(REPLACE(REPLACE(col, ',', ''), '%', '') AS FLOAT) before aggregating, comparing, OR SORTING -- an uncast ORDER BY sorts alphabetically, so '10,000.00' ranks above '9,933,927.27' and a top-N panel is silently wrong. Typing is NOT uniform by suffix: GOP_AED is text but GOPPAR_AED, AVERAGE_CHECK_AED, REVENUE_PER_COVER_AED, ESTIMATED_CAC_AED and PROFIT_PER_AVAILABLE_ROOM_AED are real NUMBER. Check each column's own (TEXT, comma/percent-formatted) note rather than casting by name pattern.
"""

[tables."HOSPITALITY_DB.PUBLIC.HOSPITALITY"]
description = "Monthly property-level hospitality performance master. One row per property-month, ~800 rows total across 40 properties / 6 countries / 13 cities, Jan 2025 - Aug 2026."
notes = "Single-table dataset — no join keys or child tables. Many revenue and rate columns are stored as TEXT with BOTH comma thousands-separators (e.g. \"9,933,927.27\") AND a literal trailing '%' on percentage fields (e.g. \"81.6%\"). Strip both with REPLACE(REPLACE(col, ',', ''), '%', '') and TRY_CAST to FLOAT before aggregating, comparing OR SORTING -- an uncast ORDER BY sorts alphabetically, so '10,000.00' outranks '9,933,927.27' and a top-N panel is silently wrong. Typing is not uniform by suffix: GOP_AED is text while GOPPAR_AED, AVERAGE_CHECK_AED, REVENUE_PER_COVER_AED, ESTIMATED_CAC_AED and PROFIT_PER_AVAILABLE_ROOM_AED are real NUMBER, so check each column's own note rather than casting by name pattern. These columns are flagged with a (TEXT, comma/percent-formatted) note below."

