database = "FINTECH_DB"
display_name = "GCC Digital Lending & Neobank Performance Data"
description = "Weekly digital lending / neobank performance data covering customer acquisition funnel, acquisition economics, portfolio & credit risk (DPD buckets, NPL, PD proxies), collections & recovery, KYC/AML/fraud, underwriting, funding/liquidity, unit economics, and financial portfolio flows across GCC markets and products. One row per market/product per week. Single flat table — no related child tables."
currency = "AED"
join_rules = """
- FINTECH_DB.PUBLIC.FINTECH is a single standalone table — there are no other tables in this database and no join keys to manage.
- Every metric for this domain lives in this one table; never attempt to join it to tables from a different database.
"""
dashboard_heuristics = """
- Query the table directly; one table, no joins.
- TRENDS: group and ORDER BY WEEK_START, or DATE_TRUNC('month', WEEK_START)
  for a monthly view. NEVER group or order by MONTH or QUARTER or VINTAGE_COHORT --
  they are TEXT labels ('Feb-2025'), so they sort ALPHABETICALLY and a trend
  chart comes out Apr, Aug, Dec, Feb. Use them only as a display label
  beside the real WEEK_START date.
- BREAKDOWNS: group by the categorical attribute columns.
- NEVER average a rate. Every *_PCT column is already computed for its own
  row, so AVG() across rows is an unweighted mean of ratios and is simply
  wrong -- it looks plausible and nothing on screen reveals it. Recompute
  from the underlying counts or amounts instead:
    100.0 * SUM(APPROVED_APPLICATIONS) / NULLIF(SUM(CREDIT_ASSESSED), 0)
    NOT AVG(APPROVAL_RATE_PCT)
  The same applies to any ratio, average or per-unit column, not just _PCT.
- Report ACTUALS by default. Budget, forecast, target and benchmark columns (whether prefixed BUDGET_/FORECAST_/TARGET_/BENCHMARK_ or suffixed _BUDGET_AED/_FORECAST_AED) belong in variance panels only -- use them when the request is explicitly about budget, forecast, target or benchmark.
- Use the primary column, never its QA twin. The CALC_* columns (CALC_APPROVAL_RATE_PCT, CALC_TOTAL_REVENUE_AED, ...) exist only to cross-check the reported value: put them in a reconciliation panel or leave them out. Never chart a CALC_* column as the headline figure and never sum it alongside its primary.
- All monetary columns are AED and are clean NUMBER -- no casting, no REPLACE(), no TRY_CAST is needed anywhere in this table.
"""

[tables."FINTECH_DB.PUBLIC.FINTECH"]
description = "Weekly digital lending and neobank performance master. One row per market/product-week, ~800 rows total across 6 countries / 10 products / 7 customer segments / 7 fintech verticals, Feb 2025 - Aug 2026."
notes = "Single-table dataset — no join keys or child tables. All monetary columns are clean NUMBER type — no comma-text formatting issue. Column ordinal positions have gaps, indicating some columns were dropped from the schema after initial creation; does not affect usability. Includes a block of CALC_* columns for QA cross-checking against primary reported values."

